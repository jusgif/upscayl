<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Upscayl Mobile</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#f5f5f7}
main{max-width:720px;margin:auto;padding:24px 18px 40px}
h1{margin:8px 0 4px;font-size:32px}.sub{color:#a7a7b0;margin-bottom:24px}
.card{background:#15151c;border:1px solid #292933;border-radius:18px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;color:#aaa;margin:12px 0 6px}
input,select,button{width:100%;border-radius:12px;border:1px solid #353541;background:#101017;color:#fff;padding:13px;font-size:16px}
button{background:#fff;color:#111;border:0;font-weight:700;margin-top:16px}
button:disabled{opacity:.45}#preview{width:100%;max-height:360px;object-fit:contain;border-radius:12px;margin-top:12px;display:none}
#progress{height:8px;background:#292933;border-radius:99px;overflow:hidden;margin-top:16px;display:none}
#bar{height:100%;width:0;background:#fff;transition:width .3s}
.status{color:#aaa;font-size:14px;margin-top:10px;white-space:pre-wrap}
small{color:#888;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>Upscayl</h1>
<div class="sub">AI image upscaling for Android</div>

<div class="card">
<label>Upscayl API key</label>
<input id="key" type="password" placeholder="Paste your API key">
<small>Your key is stored only on this device and is never bundled into the APK.</small>

<label>Image</label>
<input id="file" type="file" accept="image/*">
<img id="preview">

<label>Model</label>
<select id="model">
<option value="quick-clear-4x">Quick Clear 4x</option>
<option value="ultramix-balanced">Ultramix Balanced</option>
<option value="ultrasharp">Ultrasharp</option>
<option value="remacri">Remacri</option>
</select>

<label>Scale</label>
<select id="scale"><option value="2">2x</option><option value="3">3x</option><option value="4" selected>4x</option></select>

<button id="go" disabled>Upscale image</button>
<div id="progress"><div id="bar"></div></div>
<div id="status" class="status"></div>
</div>

<div class="card">
<small>Mobile builds use the Upscayl Cloud API because the desktop application invokes native NCNN/Vulkan binaries that are not Android executables. The desktop build remains unchanged.</small>
</div>
</main>
<script>
const API="https://api.upscayl.org";
const key=document.querySelector("#key"), file=document.querySelector("#file"), go=document.querySelector("#go");
const preview=document.querySelector("#preview"), status=document.querySelector("#status");
const progress=document.querySelector("#progress"), bar=document.querySelector("#bar");
key.value=localStorage.getItem("upscayl-api-key")||"";
key.addEventListener("input",()=>{localStorage.setItem("upscayl-api-key",key.value.trim());check()});
file.addEventListener("change",()=>{if(file.files[0]){preview.src=URL.createObjectURL(file.files[0]);preview.style.display="block"}check()});
function check(){go.disabled=!(key.value.trim()&&file.files?.[0])}
function msg(s){status.textContent=s}
async function request(path, options={}) {
  const headers={"X-API-Key":key.value.trim(),...(options.headers||{})};
  const r=await fetch(API+path,{...options,headers});
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch{throw new Error(text||("HTTP "+r.status))}
  if(!r.ok) throw new Error(data.message||data.error||("HTTP "+r.status));
  return data;
}
function unwrap(x){return x?.data??x?.result??x}
go.onclick=async()=>{
  const f=file.files[0]; go.disabled=true; progress.style.display="block"; bar.style.width="5%"; msg("Uploading…");
  try{
    const form=new FormData();
    form.append("file",f,f.name); form.append("urls",""); form.append("model",document.querySelector("#model").value);
    form.append("scale",document.querySelector("#scale").value); form.append("saveImageAs","png"); form.append("enhanceFace","false");
    const created=unwrap(await request("/start-task",{method:"POST",body:form}));
    const taskId=created.taskId||created.id||created.task?.taskId;
    if(!taskId) throw new Error("API did not return a task ID.");
    msg("Upscaling…");
    let outputUrl;
    for(let i=0;i<180;i++){
      await new Promise(r=>setTimeout(r,2000));
      const s=unwrap(await request("/get-task-status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:{taskId}})}));
      const pct=Number(s.progress??s.percent??s.task?.progress??0);
      bar.style.width=Math.min(95,Math.max(5,pct))+"%";
      const state=String(s.status??s.state??s.task?.status??"").toLowerCase();
      outputUrl=s.outputUrl||s.downloadUrl||s.resultUrl||s.task?.outputUrl||s.task?.downloadUrl;
      if(outputUrl || ["completed","complete","done","success","succeeded"].includes(state)) break;
      if(["failed","error","cancelled"].includes(state)) throw new Error(s.message||"Upscaling failed.");
    }
    if(!outputUrl) throw new Error("Upscaling finished without a downloadable result.");
    msg("Downloading result…"); bar.style.width="100%";
    const result=await fetch(outputUrl); if(!result.ok) throw new Error("Could not download the result.");
    const blob=await result.blob(); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=f.name.replace(/\.[^.]+$/,"")+"_upscayl.png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000); msg("Done. The upscaled PNG was saved/downloaded.");
  }catch(e){bar.style.width="0%";msg("Error: "+(e?.message||e))}finally{go.disabled=false;check()}
};
</script>
</body>
</html>
