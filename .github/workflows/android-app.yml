name: Upscayl Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;29.0.14206865"

      - name: Fetch NCNN Vulkan package
        run: bash ./scripts/fetch-ncnn.sh

      - name: Verify native ABI inputs
        run: |
          echo "Checking NCNN Android Vulkan package layout..."
          find app/src/main/prebuilt -maxdepth 3 -type d | sort
          if find app/src/main/prebuilt -type d \( -name armeabi -o -name mips -o -name mips64 \) | grep -q .; then
            echo "Unsupported legacy ABI directory found in NCNN package"
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Upscayl-Android-APK
          path: android-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
