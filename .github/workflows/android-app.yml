name: Android App CI
on:
  push:
    branches: [ main, android-app ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;29.0.13113456"
      - name: Fetch NCNN Vulkan package
        run: bash ./scripts/fetch-ncnn.sh
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: upscayl-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
